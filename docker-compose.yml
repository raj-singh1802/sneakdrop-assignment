services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sneaker
      POSTGRES_PASSWORD: sneaker
      POSTGRES_DB: sneakerdrop
    volumes:
      - ./src/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sneaker -d sneakerdrop"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://sneaker:sneaker@db:5432/sneakerdrop
      ENABLE_ADMIN: "1"
      PROVIDER_URL: http://provider:9000
      WEBHOOK_SECRET: dev-secret-change-me
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  provider:
    build: .
    command: uvicorn fake_provider.main:app --host 0.0.0.0 --port 9000
    environment:
      WEBHOOK_URL: http://api:8000/webhooks/payment
      WEBHOOK_SECRET: dev-secret-change-me
      CHAOS_MAX_DELAY: "4"
    ports:
      - "9000:9000"
